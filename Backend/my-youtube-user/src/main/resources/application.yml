spring:
  config:
    import:
      - classpath:application-common.yml
      - optional:classpath:application-local.yml
  application:
    name: my-youtube-user-service

rocketmq:
  producer:
    group: myyoutube_user_producer

server:
  port: ${SERVER_PORT:8081}

my-youtube:
  db-name: user_db
  # video-service 已注册进 Nacos, 置空走负载均衡; 回退时设 VIDEO_SERVICE_URL=http://localhost:8090
  video-service:
    url: ${VIDEO_SERVICE_URL:}

# 各服务共享基础配置(由各服务 spring.config.import 引入)。
# 公共本地覆盖使用独立文件名，避免被服务自己的 application-local.yml 遮蔽。
spring:
  config:
    import: optional:classpath:application-common-local.yml
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER:DEFAULT}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 库名由各服务提供 my-youtube.db-name; admin/gateway 无库, 不绑定此属性
    url: jdbc:mysql://${DATASOURCE_HOST:localhost}:3306/${my-youtube.db-name}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      timeout: 3000ms

rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  producer:
    send-message-timeout: 3000

jwt:
  secret: ${JWT_SECRET:dev-insecure-jwt-secret}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.diaojiahong.myyoutube

management.endpoints.web.exposure.include: ${OBSERVABILITY_ACTUATOR_ENDPOINTS:health}

my-youtube:
  # 网关与服务间共享的内部密钥, 置空或纯空白则不启用来源校验且不发送凭证头; 生产务必通过 INTERNAL_TOKEN 设置
  internal-token: ${INTERNAL_TOKEN:}

# video 与 transcode 使用同一份模板配置。首次启用前先在 Nacos 发布完整 YAML。
my-youtube.prompts.nacos:
  enabled: ${PROMPTS_NACOS_ENABLED:false}
  server-addr: ${NACOS_ADDR:localhost:8848}
  namespace: ${NACOS_NAMESPACE:}
  username: ${NACOS_USERNAME:}
  password: ${NACOS_PASSWORD:}
  data-id: ${PROMPTS_NACOS_DATA_ID:model-prompts.yaml}
  group: ${PROMPTS_NACOS_GROUP:PROMPTS_GROUP}

my-youtube.frame-processing:
  interval-seconds: ${VIDEO_FRAME_INTERVAL_SECONDS:5}
  max-frames: ${VIDEO_FRAME_MAX_COUNT:10}
  min-success-percent: ${VIDEO_FRAME_MIN_SUCCESS_PERCENT:80}
  cover-max-candidates: ${COVER_MAX_CANDIDATES:8}
  ocr-batch-size: ${OCR_BATCH_SIZE:2}
  review-batch-size: ${CONTENT_REVIEW_FRAME_BATCH_SIZE:4}
  nacos:
    enabled: ${FRAME_SETTINGS_NACOS_ENABLED:false}
    server-addr: ${NACOS_ADDR:localhost:8848}
    namespace: ${NACOS_NAMESPACE:}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    data-id: ${FRAME_SETTINGS_NACOS_DATA_ID:frame-processing.yaml}
    group: ${FRAME_SETTINGS_NACOS_GROUP:MEDIA_GROUP}

my-youtube.observability:
  recording.enabled: ${PIPELINE_EVENT_RECORDING_ENABLED:false}
  delivery.enabled: ${PIPELINE_EVENT_DELIVERY_ENABLED:false}
  cleanup.enabled: ${PIPELINE_EVENT_CLEANUP_ENABLED:false}
  scan-interval-ms: ${PIPELINE_EVENT_SCAN_INTERVAL_MS:250}
  cleanup-interval-ms: ${PIPELINE_EVENT_CLEANUP_INTERVAL_MS:60000}
  batching:
    claim-limit: ${PIPELINE_EVENT_CLAIM_LIMIT:200}
    max-events: ${PIPELINE_EVENT_BATCH_MAX_EVENTS:100}
    max-bytes: ${PIPELINE_EVENT_BATCH_MAX_BYTES:262144}
    lease-seconds: ${PIPELINE_EVENT_LEASE_SECONDS:30}
    cleanup-page-size: ${PIPELINE_EVENT_CLEANUP_PAGE_SIZE:200}
  monitoring:
    enabled: ${PIPELINE_MONITORING_ENABLED:false}
    interval-ms: ${PIPELINE_METRICS_INTERVAL_MS:30000}
    page-limit: ${PIPELINE_METRICS_PAGE_LIMIT:2000}

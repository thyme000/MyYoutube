# 各服务共享基础配置(由各服务 spring.config.import 引入)。
# 服务特有项写在各自 application.yml, 本地覆盖写 application-local.yml(gitignore, 最后 import 优先级最高)。
spring:
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_CLUSTER:DEFAULT}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 库名由各服务提供 my-youtube.db-name; admin/search/gateway 无库, 不绑定此属性
    url: jdbc:mysql://${DATASOURCE_HOST:localhost}:3306/${my-youtube.db-name}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      timeout: 3000ms

rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  producer:
    send-message-timeout: 3000

jwt:
  secret: ${JWT_SECRET:dev-insecure-jwt-secret}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.diaojiahong.myyoutube

my-youtube:
  # 网关与下游共享的内部密钥, 置空则不启用来源校验; 生产务必通过 INTERNAL_TOKEN 设置
  internal-token: ${INTERNAL_TOKEN:}

# video 与 transcode 使用同一份模板配置。首次启用前先在 Nacos 发布完整 YAML。
my-youtube.prompts.nacos:
  enabled: ${PROMPTS_NACOS_ENABLED:false}
  server-addr: ${NACOS_ADDR:localhost:8848}
  namespace: ${NACOS_NAMESPACE:}
  username: ${NACOS_USERNAME:}
  password: ${NACOS_PASSWORD:}
  data-id: ${PROMPTS_NACOS_DATA_ID:model-prompts.yaml}
  group: ${PROMPTS_NACOS_GROUP:PROMPTS_GROUP}

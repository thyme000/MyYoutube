spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: my-youtube-video-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 阶段二过渡: 先与旧单体共用 my_youtube 库, 第 5 步统一拆 schema 到 video_db
    url: jdbc:mysql://${DATASOURCE_HOST:localhost}:3306/my_youtube?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  producer:
    group: myyoutube_video_producer
    send-message-timeout: 3000

server:
  port: ${SERVER_PORT:8082}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.diaojiahong.myyoutube

# 过渡期: user/search 服务尚未独立, Feign 直连旧单体; 对应服务拆出后置空走 Nacos
my-youtube:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8090}
  search-service:
    url: ${SEARCH_SERVICE_URL:http://localhost:8090}
  chat-service:
    url: ${CHAT_SERVICE_URL:http://localhost:8090}

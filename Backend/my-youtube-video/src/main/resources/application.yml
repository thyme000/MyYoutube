spring:
  config:
    import:
      - classpath:application-common.yml
      - optional:classpath:application-local.yml
  application:
    name: my-youtube-video-service
  datasource:
    hikari:
      maximum-pool-size: 5

rocketmq:
  producer:
    group: myyoutube_video_producer

server:
  port: ${SERVER_PORT:8082}

# 全部服务已注册进 Nacos, 置空走负载均衡
my-youtube:
  db-name: video_db
  user-service:
    url: ${USER_SERVICE_URL:}
  search-service:
    url: ${SEARCH_SERVICE_URL:}
  chat-service:
    url: ${CHAT_SERVICE_URL:}
  transcode-service:
    url: ${TRANSCODE_SERVICE_URL:}
  llm-service:
    url: ${LLM_SERVICE_URL:}
  recommend:
    cf:
      # 在线相似度表选择: itemcf | swing, 两份都离线算好, 改这里重启即切换
      algorithm: swing
  autotag:
    # 打标防线阈值, 必填无默认(0~1), 缺失服务拒绝启动; 真实值填 application-local.yml
    # min-confidence: 0.5

spring:
  config:
    import:
      - classpath:application-common.yml
      - optional:classpath:application-local.yml
  application:
    name: my-youtube-video-service
  datasource:
    hikari:
      maximum-pool-size: 5

rocketmq:
  producer:
    group: myyoutube_video_producer

server:
  port: ${SERVER_PORT:8082}

# 全部服务已注册进 Nacos, 置空走负载均衡
my-youtube:
  db-name: video_db
  user-service:
    url: ${USER_SERVICE_URL:}
  search-service:
    url: ${SEARCH_SERVICE_URL:}
  chat-service:
    url: ${CHAT_SERVICE_URL:}
  transcode-service:
    url: ${TRANSCODE_SERVICE_URL:}
  recommend:
    cf:
      # 在线相似度表选择: itemcf | swing, 两份都离线算好, 改这里重启即切换
      algorithm: swing
  llm:
    # OpenAI 兼容接口, 换厂商只改 base-url/model/api-key
    base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:glm-4-flash}
    timeout-seconds: 20
    max-tokens: 512
    # 低于该置信度的标签丢弃
    min-confidence: 0.5

spring:
  config:
    import:
      - classpath:application-common.yml
      - optional:classpath:application-local.yml
  application:
    name: my-youtube-video-service
  datasource:
    hikari:
      maximum-pool-size: 5

rocketmq:
  producer:
    group: myyoutube_video_producer

server:
  port: ${SERVER_PORT:8082}

# 全部服务已注册进 Nacos, 置空走负载均衡
my-youtube:
  db-name: video_db
  user-service:
    url: ${USER_SERVICE_URL:}
  search-service:
    url: ${SEARCH_SERVICE_URL:}
  chat-service:
    url: ${CHAT_SERVICE_URL:}
  transcode-service:
    url: ${TRANSCODE_SERVICE_URL:}
  recommend:
    cf:
      # 在线相似度表选择: itemcf | swing, 两份都离线算好, 改这里重启即切换
      algorithm: swing
  llm:
    # OpenAI 兼容接口; provider: zhipu|deepseek|qwen|openai, base-url/model 不填用厂商默认, 填了覆盖
    provider: ${LLM_PROVIDER:zhipu}
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    temperature: 0.2
    timeout-seconds: 20
    max-tokens: 512
    # 必填无默认(0~1), 缺失服务拒绝启动; 真实值填 application-local.yml
    # min-confidence: 0.5

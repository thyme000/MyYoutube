spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: my-youtube-chat-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DATASOURCE_HOST:localhost}:3306/chat_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:mongo123456@localhost:27017/chat_db?authSource=admin}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      timeout: 3000ms

rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  producer:
    group: myyoutube_chat_producer
    send-message-timeout: 3000

jwt:
  secret: ${JWT_SECRET:dev-insecure-jwt-secret}

server:
  port: ${SERVER_PORT:8083}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.diaojiahong.myyoutube

my-youtube:
  # 网关与下游共享的内部密钥, 置空则不启用来源校验; 生产务必通过 INTERNAL_TOKEN 设置
  internal-token: ${INTERNAL_TOKEN:}
  user-service:
    url: ${USER_SERVICE_URL:}
  video-service:
    url: ${VIDEO_SERVICE_URL:}
  ws:
    # 生产改为站点具体来源, 如 https://www.example.com
    allowed-origins: ${WS_ALLOWED_ORIGINS:*}

spring:
  config:
    import:
      - classpath:application-common.yml
      - optional:classpath:application-local.yml
  application:
    name: my-youtube-chat-service
  # 聊天数据本体在 MongoDB, 无 MySQL 表; 排除 common 传递进来的 JDBC/MyBatis 自动配置
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:mongo123456@localhost:27017/chat_db?authSource=admin}

rocketmq:
  producer:
    group: myyoutube_chat_producer

server:
  port: ${SERVER_PORT:8083}

my-youtube:
  user-service:
    url: ${USER_SERVICE_URL:}
  video-service:
    url: ${VIDEO_SERVICE_URL:}
  ws:
    # 生产改为站点具体来源, 如 https://www.example.com
    allowed-origins: ${WS_ALLOWED_ORIGINS:*}

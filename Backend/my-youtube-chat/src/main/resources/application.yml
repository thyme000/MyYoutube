spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: my-youtube-chat-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 阶段二过渡: emoji 表暂在 my_youtube 库, 第 5 步迁到 chat_db
    url: jdbc:mysql://${DATASOURCE_HOST:localhost}:3306/my_youtube?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:mongo123456@localhost:27017/my_youtube?authSource=admin}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  producer:
    group: myyoutube_chat_producer
    send-message-timeout: 3000

server:
  port: ${SERVER_PORT:8083}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: cn.diaojiahong.myyoutube

my-youtube:
  user-service:
    url: ${USER_SERVICE_URL:}
  video-service:
    url: ${VIDEO_SERVICE_URL:}

spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: my-youtube-search-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  # search 无 MySQL, 排除 JDBC/MyBatis 自动配置(common 契约携带依赖)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9201}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  producer:
    group: myyoutube_search_producer
    send-message-timeout: 3000

server:
  port: ${SERVER_PORT:8084}

# 过渡期: user 服务已注册, 置空走 Nacos 负载均衡
my-youtube:
  user-service:
    url: ${USER_SERVICE_URL:}
  video-service:
    url: ${VIDEO_SERVICE_URL:}

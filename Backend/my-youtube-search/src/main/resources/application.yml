spring:
  config:
    import:
      - classpath:application-common.yml
      - optional:classpath:application-local.yml
  cloud:
    openfeign:
      client:
        config:
          searchContentSummaryClient:
            connectTimeout: 1000
            readTimeout: 2000
  application:
    name: my-youtube-search-service
  datasource:
    hikari:
      maximum-pool-size: 3
      connection-timeout: 1000
      data-source-properties:
        connectTimeout: 1000
        socketTimeout: 5000
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9201}

rocketmq:
  producer:
    group: myyoutube_search_producer

server:
  port: ${SERVER_PORT:8084}

# 过渡期: user 服务已注册, 置空走 Nacos 负载均衡
my-youtube:
  async-timeouts:
    resources:
      keyword-recall:
        executor: recallExecutor
        timeout-millis: ${SEARCH_KEYWORD_WAIT_MILLIS:2000}
      vector-recall:
        executor: queryVectorExecutor
        timeout-millis: ${SEARCH_VECTOR_WAIT_MILLIS:2000}
  db-name: search_db
  user-service:
    url: ${USER_SERVICE_URL:}
  video-service:
    url: ${VIDEO_SERVICE_URL:}
  llm-service:
    url: ${LLM_SERVICE_URL:http://localhost:8087}
  search:
    hot:
      enabled: ${HOT_SEARCH_ENABLED:true}
      top-limit: ${HOT_SEARCH_TOP_LIMIT:7}
      excluded-location: ${HOT_SEARCH_EXCLUDED_LOCATION:hot-search/excluded.txt}
      refresh-millis: ${HOT_SEARCH_REFRESH_MILLIS:300000}
      # 初值需使用当前 embedding 的中文搜索样例校准。
      similarity-threshold: ${HOT_SEARCH_SIMILARITY_THRESHOLD:0.82}
      min-users: ${HOT_SEARCH_MIN_USERS:2}
      max-length: 64
      alias-ttl-seconds: 86400
      snapshot-ttl-seconds: 900
      batch-size: 200
      max-distinct-per-round: 32
      max-new-groups-per-round: 8
      pending-limit: 10000
      # 路由布局配置；变更前排空旧输入，并统一重启 search 实例。
      partition-count: ${HOT_SEARCH_PARTITION_COUNT:16}
      model-timeout-seconds: ${HOT_SEARCH_MODEL_TIMEOUT_SECONDS:30}
      round-budget-seconds: 120
    ranking:
      fields:
        title: ${SEARCH_TITLE_WEIGHT:5}
        tag-names: ${SEARCH_TAG_NAMES_WEIGHT:4}
        author-name: ${SEARCH_AUTHOR_NAME_WEIGHT:2}
        description: ${SEARCH_DESCRIPTION_WEIGHT:3}
      keyword:
        follow: ${SEARCH_KEYWORD_FOLLOW_WEIGHT:0.20}
        play: ${SEARCH_KEYWORD_PLAY_WEIGHT:0.02}
        like: ${SEARCH_KEYWORD_LIKE_WEIGHT:0.04}
        max-multiplier: ${SEARCH_KEYWORD_MAX_MULTIPLIER:1.50}
      vector:
        follow: ${SEARCH_VECTOR_FOLLOW_WEIGHT:0.08}
        play: ${SEARCH_VECTOR_PLAY_WEIGHT:0.01}
        like: ${SEARCH_VECTOR_LIKE_WEIGHT:0.02}
        max-multiplier: ${SEARCH_VECTOR_MAX_MULTIPLIER:1.20}
    recall:
      first-page-size: ${SEARCH_FIRST_PAGE_SIZE:30}
      es-timeout-millis: ${SEARCH_ES_TIMEOUT_MILLIS:2000}
      embedding-timeout-millis: ${SEARCH_EMBEDDING_TIMEOUT_MILLIS:10000}
      refill-max-rounds: ${SEARCH_REFILL_MAX_ROUNDS:2}
      refill-max-candidates: ${SEARCH_REFILL_MAX_CANDIDATES:500}
      refill-batch-size: ${SEARCH_REFILL_BATCH_SIZE:50}
    vector:
      # 总开关, 关闭即回退纯关键词搜索
      enabled: true
      query-max-concurrent: ${SEARCH_QUERY_VECTOR_MAX_CONCURRENT:2}
      query-queue-capacity: ${SEARCH_QUERY_VECTOR_QUEUE_CAPACITY:4}
      # 整次 LLM RPC 的读取超时；批量包含多轮子批次及失败隔离
      single-read-timeout-seconds: ${EMBEDDING_SINGLE_READ_TIMEOUT_SECONDS:130}
      batch-read-timeout-seconds: ${EMBEDDING_BATCH_READ_TIMEOUT_SECONDS:600}
      # RRF 平滑常数
      rrf-k: 60
      # 每路召回深度
      recall-size: 50
  recommend:
    cf:
      # 关闭后退回 tag+热度两路(算法选择在 video 服务的 recommend.cf.algorithm)
      enabled: true
    fusion:
      # RRF 平滑常数与三路权重
      k: 60
      weights:
        tag: 1.0
        hot: 0.6
        cf: 1.0

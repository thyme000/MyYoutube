spring:
  config:
    import:
      - classpath:application-common.yml
      - optional:classpath:application-local.yml
  application:
    name: my-youtube-search-service
  # search 无 MySQL, 排除 JDBC/MyBatis 自动配置(common 契约携带依赖)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9201}

rocketmq:
  producer:
    group: myyoutube_search_producer

server:
  port: ${SERVER_PORT:8084}

# 过渡期: user 服务已注册, 置空走 Nacos 负载均衡
my-youtube:
  user-service:
    url: ${USER_SERVICE_URL:}
  video-service:
    url: ${VIDEO_SERVICE_URL:}

spring:
  config:
    import:
      - classpath:application-common.yml
      - optional:classpath:application-local.yml
  task.scheduling:
    pool.size: 4
    thread-name-prefix: media-schedule-
  application:
    name: my-youtube-transcode-service
  datasource:
    hikari:
      maximum-pool-size: 5

rocketmq:
  producer:
    group: myyoutube_transcode_producer

server:
  port: ${SERVER_PORT:8086}

my-youtube:
  db-name: transcode_db
  llm-service:
    url: ${LLM_SERVICE_URL:}
  cover:
    # 默认使用图像质量评分选帧，显式开启后才调用视觉大模型
    vision-enabled: ${COVER_VISION_ENABLED:false}
    # 封面选帧视觉模型; 留空回落 llm-svc 默认模型, 真实值填 application-local.yml
    vision-model: ${LLM_VISION_MODEL:}

spring.cloud.openfeign.client.config:
  default:
    connectTimeout: 5000
    readTimeout: 130000
  asrPort:
    readTimeout: 1350000
  ocrPort:
    readTimeout: ${OCR_READ_TIMEOUT_MS:210000}
my-youtube.media-pipeline:
  retry-batch-size: ${MEDIA_RETRY_BATCH_SIZE:20}
  retry-concurrency: ${MEDIA_RETRY_CONCURRENCY:1}
  retry-occupation-seconds: ${MEDIA_RETRY_OCCUPATION_SECONDS:3600}
  chunk-characters: ${CONTENT_CHUNK_CHARACTERS:12000}
  lease-seconds: ${MEDIA_LEASE_SECONDS:150}
  model-unavailable-wait-seconds: ${MODEL_UNAVAILABLE_WAIT_SECONDS:600}
  draft-concurrency: ${DRAFT_WORKER_CONCURRENCY:1}
  content-concurrency: ${CONTENT_WORKER_CONCURRENCY:4}
  review-concurrency: ${REVIEW_WORKER_CONCURRENCY:2}
my-youtube.asr.url: ${ASR_SERVICE_URL:}
my-youtube.ocr.url: ${OCR_SERVICE_URL:}

my-youtube.local-model-services:
  start-on-boot: ${MODEL_SERVICES_START_ON_BOOT:true}
  startup-wait: ${MODEL_SERVICES_STARTUP_WAIT:180s}
  stop-on-shutdown: ${MODEL_SERVICES_STOP_ON_SHUTDOWN:true}
  project-root: ${MODEL_SERVICES_PROJECT_ROOT:}
  shutdown-wait: ${MODEL_SERVICES_SHUTDOWN_WAIT:30s}
  asr-python: ${MODEL_SERVICES_ASR_PYTHON:}
  ocr-python: ${MODEL_SERVICES_OCR_PYTHON:}

management:
  metrics.distribution.percentiles-histogram:
    "[media.pipeline.duration]": true
    "[media.pipeline.ready.duration]": true
    "[media.node.wait]": true
    "[media.node.retry.wait]": true
    "[model.calls.duration]": true
sentinel:
  nacos:
    enabled: ${SENTINEL_NACOS_ENABLED:false}
    server-addr: ${NACOS_ADDR:localhost:8848}
    namespace: ${NACOS_NAMESPACE:}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    data-id: ${spring.application.name}-model-degrade.json
    group: SENTINEL_GROUP

media.monitor.dlq-groups: transcode_draft_worker,transcode_content_worker,transcode_review_worker,transcode_content_submitted,transcode_review_requested,transcode_media_upload_event_group

my-youtube.media-preparation:
  long-edge: ${MEDIA_PREPARATION_LONG_EDGE:1600}
  output-pixels: ${MEDIA_PREPARATION_OUTPUT_PIXELS:1600000}
  jpeg-quality: ${MEDIA_PREPARATION_JPEG_QUALITY:0.85}
  source-bytes: ${MEDIA_PREPARATION_SOURCE_BYTES:33554432}
  source-pixels: ${MEDIA_PREPARATION_SOURCE_PIXELS:40000000}
  source-long-edge: ${MEDIA_PREPARATION_SOURCE_LONG_EDGE:16000}
  video-source-bytes: ${MEDIA_PREPARATION_VIDEO_SOURCE_BYTES:2147483648}
  video-max-level: ${MEDIA_PREPARATION_VIDEO_MAX_LEVEL:51}

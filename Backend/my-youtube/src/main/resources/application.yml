# 敏感信息请勿写在本文件中，请通过环境变量或 application-local.yml（已加入 .gitignore）提供。
spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: my-youtube
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  # ===== Elasticsearch =====
  elasticsearch:
    uris: http://localhost:9201

  # ===== MySQL 数据源 =====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DATASOURCE_HOST:localhost}:3306/my_youtube?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 1
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
          max-wait: 1000ms

  # ===== MongoDB =====
    mongodb:
      uri: ${MONGODB_URI}

# ===== RocketMQ =====
rocketmq:
  name-server: ${ROCKETMQ_NAMESERVER:localhost:9876}
  producer:
    group: myyoutube_producer
    send-message-timeout: 3000

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: cn.diaojiahong.myyoutube
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ===== S3 兼容对象存储(RustFS/MinIO 通用)，密钥勿提交，可用 application-local.yml 覆盖 =====
my-youtube:
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket-name: ${S3_BUCKET:myyoutube}

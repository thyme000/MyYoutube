# 敏感信息请勿写在本文件中，请通过环境变量或 application-local.yml（已加入 .gitignore）提供。
spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: my-youtube
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  # ===== MySQL 数据源 =====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:my_youtube}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== Redis =====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
          max-wait: 1000ms

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: cn.diaojiahong.myyoutube
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ===== 阿里云 OSS（与 application-local.yml 中 my-youtube.alioss 字段一致；密钥勿提交）=====
# 环境变量名对应 Spring Boot 松散绑定：my-youtube.alioss.xxx → MY_YOUTUBE_ALIOSS_XXX
my-youtube:
  alioss:
    bucket-name: ${MY_YOUTUBE_ALIOSS_BUCKET_NAME:}
    access-key-id: ${MY_YOUTUBE_ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${MY_YOUTUBE_ALIOSS_ACCESS_KEY_SECRET:}
    endpoint: ${MY_YOUTUBE_ALIOSS_ENDPOINT:}


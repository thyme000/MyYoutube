spring:
  application:
    name: my-youtube

  # ===== MySQL 数据源 =====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/my_youtube?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    # 连接池（HikariCP，Spring Boot 默认自带）
    hikari:
      maximum-pool-size: 10 # 最大连接数
      minimum-idle: 5 #最小空闲连接数
      connection-timeout: 30000 # 连接超时时间（毫秒）
      idle-timeout: 600000 # 空闲连接超时时间（毫秒）
      max-lifetime: 1800000 # 连接最大生命周期（毫秒）

  # ===== Redis =====
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8 # 最大连接数
          max-idle: 8 # 最大空闲连接数
          min-idle: 1 # 最小空闲连接数
          max-wait: 1000ms # 连接池获取连接的最大等待时间（毫秒）

# ===== 服务端口 =====
server:
  port: 8080

# ===== MyBatis =====
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: cn.diaojiahong.myyoutube.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

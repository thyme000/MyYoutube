# 网关不依赖 common 模块(servlet 栈), 共享配置无法 import, 自带以下键
spring:
  main:
    # common 依赖带 starter-web(servlet 栈), 不显式声明 Boot 会把网关起成 Servlet 应用, GlobalFilter 全失效
    web-application-type: reactive
  autoconfigure:
    # common 传递进来的 JDBC/MyBatis/RocketMQ 自动装配与网关无关, 显式排除防误启
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
      - org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
  config:
    import: optional:classpath:application-local.yml
  application:
    name: my-youtube-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
    gateway:
      server:
        webflux:
          # json-to-grpc 过滤器依赖 grpc 类库, 本项目用不到, 关闭
          filter:
            json-to-grpc:
              enabled: false
          routes:
            # ---- 业务服务路由(拆一个启用一个, order 越小越优先) ----
            # 内部接口不经网关暴露
            - id: block-internal
              uri: no://op
              predicates: [ "Path=/internal/**" ]
              filters: [ "SetStatus=404" ]
              order: 5
            - id: user-service
              uri: lb://my-youtube-user-service
              # /login 等公开路径在鉴权白名单(my-youtube.auth.whitelist)与路由各出现一次:
              # 白名单管"免验签", 路由管"转发到哪", 职责不同
              predicates: [ "Path=/user/**,/login,/register,/forget-password,/refresh,/logout,/storage/**" ]
              order: 10
            - id: video-service
              uri: lb://my-youtube-video-service
              predicates: [ "Path=/contents/**,/audios/**,/like/**,/comment/**,/follow/**,/notification/**,/behavior/**,/history/**,/collect/**,/tag/**,/video-tag/**,/user-tag-preference/**" ]
              order: 20
            - id: chat-service
              uri: lb://my-youtube-chat-service
              predicates: [ "Path=/chat/**,/sse/**" ]
              order: 30
            # 聊天 WS(进聊天页才连), 须用 lb:ws 转发 Upgrade 握手
            - id: chat-ws
              uri: lb:ws://my-youtube-chat-service
              predicates: [ "Path=/ws/**" ]
              order: 31
            - id: search-service
              uri: lb://my-youtube-search-service
              predicates: [ "Path=/search/**" ]
              order: 40
            - id: admin-service
              uri: lb://my-youtube-admin-service
              predicates: [ "Path=/admin/**" ]
              order: 50

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}

jwt:
  secret: ${JWT_SECRET:dev-insecure-jwt-secret}

server:
  port: 8080

my-youtube:
  # 网关与下游共享的内部密钥, 置空则不启用来源校验; 生产务必通过 INTERNAL_TOKEN 设置
  internal-token: ${INTERNAL_TOKEN:}
  # 鉴权免验签白名单(精确匹配), 新增公开接口改这里; GatewayAuthFilter 读此配置
  auth:
    whitelist: /login,/register,/forget-password,/refresh,/logout

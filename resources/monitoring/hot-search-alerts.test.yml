- name: HotSearchRecordsDropped-repeated-failures
  interval: 1m
  input_series:
  - series: myyoutube_hot_search_records_total{job="myyoutube-java",service="my-youtube-search-service",instance="search-a",outcome="capacity"}
    values: 0+1x25
  alert_rule_test:
  - eval_time: 20m
    alertname: HotSearchRecordsDropped
    exp_alerts:
    - exp_labels:
        job: myyoutube-java
        service: my-youtube-search-service
        severity: warning
        outcome: capacity
      exp_annotations:
        summary: my-youtube-search-service 热搜采集发生持续丢弃（capacity），不代表用户搜索失败
- name: HotSearchOperationFailures-repeated-failures
  interval: 1m
  input_series:
  - series: myyoutube_hot_search_duration_seconds_count{job="myyoutube-java",service="my-youtube-search-service",instance="search-a",outcome="failure",operation="history_ack"}
    values: 0+1x25
  alert_rule_test:
  - eval_time: 20m
    alertname: HotSearchOperationFailures
    exp_alerts:
    - exp_labels:
        job: myyoutube-java
        service: my-youtube-search-service
        severity: warning
        operation: history_ack
      exp_annotations:
        summary: my-youtube-search-service 热搜 history_ack 多次失败，检查依赖和重试积压

rule_files:
- pipeline-alerts.yml
- hot-search-alerts.yml
evaluation_interval: 15s
tests:
- name: fresh-stock-alerts
  interval: 1m
  input_series:
  - series: myyoutube_hot_search_pending_oldest_seconds{job="myyoutube-java",service="my-youtube-search-service",instance="search-a"}
    values: 1200+0x25
  - series: myyoutube_hot_search_snapshot_ttl_seconds{job="myyoutube-java",service="my-youtube-search-service",instance="search-a"}
    values: 0+0x25
  - series: myyoutube_hot_search_archive_lag_days{job="myyoutube-java",service="my-youtube-search-service",instance="search-a"}
    values: 1+0x25
  - series: myyoutube_hot_search_archive_initialized{job="myyoutube-java",service="my-youtube-search-service",instance="search-a"}
    values: 1+0x25
  - series: myyoutube_hot_search_summary_oldest_seconds{job="myyoutube-java",service="my-youtube-search-service",instance="search-a"}
    values: 2000+0x25
  - series: pipeline_metrics_sample_success{job="myyoutube-java",service="my-youtube-search-service",instance="search-a",component="hot_search",group="all",kind="all"}
    values: 1+0x25
  - series: pipeline_metrics_sample_enabled{job="myyoutube-java",service="my-youtube-search-service",instance="search-a",component="hot_search",group="all",kind="all"}
    values: 1+0x25
  - series: pipeline_metrics_sample_age_seconds{job="myyoutube-java",service="my-youtube-search-service",instance="search-a",component="hot_search",group="all",kind="all"}
    values: 0+0x25
  alert_rule_test:
  - eval_time: 20m
    alertname: HotSearchPendingStalled
    exp_alerts:
    - exp_labels:
        job: myyoutube-java
        service: my-youtube-search-service
        severity: warning
      exp_annotations:
        summary: my-youtube-search-service 热搜最老有效事件等待超过 15 分钟
  - eval_time: 20m
    alertname: HotSearchSnapshotUnavailable
    exp_alerts:
    - exp_labels:
        job: myyoutube-java
        service: my-youtube-search-service
        severity: warning
      exp_annotations:
        summary: my-youtube-search-service 热搜共享榜单连续 10 分钟没有有效快照
  - eval_time: 20m
    alertname: HotSearchDailyArchiveDelayed
    exp_alerts:
    - exp_labels:
        job: myyoutube-java
        service: my-youtube-search-service
        severity: warning
      exp_annotations:
        summary: my-youtube-search-service 热搜每日收尾或汇总持续滞后
- name: disabled-sampling-is-not-an-empty-stock
  interval: 1m
  input_series:

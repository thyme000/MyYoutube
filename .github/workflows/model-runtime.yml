name: Model service lifecycle

on:
  pull_request:
    paths:
      - 'model_runtime/**'
      - 'asr-svc/**'
      - 'ocr-svc/**'
      - 'Backend/**'
      - '.github/workflows/model-runtime.yml'
  push:
    paths:
      - 'model_runtime/**'
      - 'asr-svc/**'
      - 'ocr-svc/**'
      - 'Backend/**'
      - '.github/workflows/model-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install runtime test dependencies
        run: python -m pip install -r model_runtime/requirements.txt numpy pillow
      - name: Shared runtime tests
        run: python -m unittest discover -s model_runtime/test -t . -v
      - name: ASR contracts with simulated workers
        working-directory: asr-svc
        env:
          PYTHONPATH: '..'
        run: python -m unittest discover -s test -t . -v
      - name: OCR contracts with simulated models
        working-directory: ocr-svc
        env:
          PYTHONPATH: '..'
        run: python -m unittest discover -s test -t . -v
      - name: Select interpreter for Java lifecycle integration
        run: python -c "import os, sys; open(os.environ['GITHUB_ENV'], 'a').write('MODEL_LIFECYCLE_PYTHON=' + sys.executable + '\n')"
      - name: Java lifecycle and temporary Python service integration
        working-directory: Backend
        env:
          SERVER_PORT: '28086'
          MODEL_LOG_DIRECTORY: '${{ runner.temp }}/transcode-parent-log'
        run: mvn -B -pl my-youtube-transcode -am -Dtest=LocalModelServicesTest,LocalModelServicesLiveTest,WorkerCorrelationTest -Dsurefire.failIfNoSpecifiedTests=false test

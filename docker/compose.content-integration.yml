name: myyoutube-content-it
services:
  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "content-it", "--bind_ip_all"]
    ports: ["127.0.0.1:17017:27017"]
    tmpfs: ["/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok == 1 } catch (e) { rs.initiate({_id:\"content-it\",members:[{_id:0,host:\"localhost:27017\"}]}).ok }'"]
      interval: 2s
      timeout: 2s
      retries: 45
  elasticsearch:
    image: myyoutube/elasticsearch-ik:8.19.0
    environment:
      discovery.type: single-node
      cluster.name: content-it
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:19200:9200"]
    tmpfs: ["/usr/share/elasticsearch/data:uid=1000,gid=1000"]
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: content-it-only
      MYSQL_DATABASE: content_it
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["./content-integration/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pcontent-it-only"]
      interval: 2s
      timeout: 2s
      retries: 45
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:16379:6379"]
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: content-it
      RUSTFS_SECRET_KEY: content-it-only
      RUSTFS_CONSOLE_ENABLE: "false"
    ports: ["127.0.0.1:19000:9000"]
    tmpfs: ["/data:uid=10001,gid=10001"]
  nameserver:
    image: apache/rocketmq:5.5.0
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"
    ports: ["127.0.0.1:19876:9876"]
  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports: ["127.0.0.1:18848:8848", "127.0.0.1:19848:9848"]
  broker:
    image: apache/rocketmq:5.5.0
    command: sh mqbroker -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    depends_on: [nameserver]
    ports: ["127.0.0.1:20911:20911", "127.0.0.1:20909:20909"]
    volumes: ["./content-integration/broker.conf:/home/rocketmq/broker.conf:ro"]
    tmpfs: ["/home/rocketmq/store:uid=3000,gid=3000", "/home/rocketmq/logs:uid=3000,gid=3000"]

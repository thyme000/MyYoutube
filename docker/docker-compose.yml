# 中间件一键部署: docker compose up -d (变量可在同目录 .env 覆盖)

services:

  mysql:
    image: mysql:8.0
    container_name: myyoutube-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: my_youtube
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: myyoutube-redis
    restart: unless-stopped
    # 启用密码时取消注释
    # command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis123456}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: myyoutube-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo123456}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    # MONGODB_URI 需带 authSource=admin, 写法见 .env
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: myyoutube-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"     # AMQP, 应用端连接
      - "15672:15672"   # 管理台 http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  elasticsearch:
    build: es-ik
    image: myyoutube/elasticsearch-ik:8.19.0
    container_name: myyoutube-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # 应用未配置账号密码
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"   # 应用连的是 9201
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: myyoutube-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-thyme}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-thyme}
      RUSTFS_CONSOLE_ENABLE: "true"
      # 浏览器直传预签名 URL 需要 CORS; 上服务器后建议改成具体域名
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "9000:9000"   # S3 API, 后端与预签名 URL 都用这个
      - "9001:9001"   # 控制台
    volumes:
      - rustfs-data:/data

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  rabbitmq-data:
  es-data:
  rustfs-data:

# 中间件一键部署: docker compose up -d (变量可在同目录 .env 覆盖)

services:

  mysql:
    image: mysql:8.0
    container_name: myyoutube-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: my_youtube
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: myyoutube-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a 123456 ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: myyoutube-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongo123456}
    # 事务要求副本集: 单节点 rs0 模式, keyFile 为开启 auth 的副本集必需。
    # keyfile 经命名卷中转: macOS bind mount 不允许容器内 chown, 命名卷允许;
    # 入口先拷 keyfile 设权限, 再交给官方 entrypoint 启动 mongod
    entrypoint: ["sh", "-c"]
    command:
      - |
        cp /src/keyfile /keys/keyfile
        chmod 400 /keys/keyfile
        chown 999:999 /keys/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /keys/keyfile
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo/keyfile:/src/keyfile:ro
      - mongo-config:/keys
    # MONGODB_URI 需带 authSource=admin, 写法见 .env
    # 健康检查顺带完成 rs.initiate(仅未初始化时), 换机器/清卷后自动生效
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --quiet --eval 'try { rs.status().ok == 1 } catch (e) { rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"localhost:27017\"}]}).ok }'"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: myyoutube-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_JVM_JAVA_OPTIONS: -Xms256m -Xmx512m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  rocketmq-nameserver:
    image: apache/rocketmq:5.5.0
    container_name: myyoutube-rocketmq-nameserver
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.5.0
    container_name: myyoutube-rocketmq-broker
    restart: unless-stopped
    command: sh mqbroker -c /home/rocketmq/broker.conf
    depends_on:
      - rocketmq-nameserver
    environment:
      # Docker Desktop 虚拟机内存配额有限, 默认 8g 堆会 OOM
      JAVA_OPT_EXT: "-Xms2g -Xmx2g -Xmn1g"
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - ../docker/rocketmq/broker.conf:/home/rocketmq/broker.conf
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: myyoutube-rocketmq-dashboard
    restart: unless-stopped
    depends_on:
      - rocketmq-broker
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-nameserver:9876"
    ports:
      - "8180:8080"   # 控制台 http://localhost:8180

  elasticsearch:
    build: es-ik
    image: myyoutube/elasticsearch-ik:8.19.0
    container_name: myyoutube-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # 应用未配置账号密码
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9201:9200"   # 应用连的是 9201
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: myyoutube-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-thyme}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-thyme}
      RUSTFS_CONSOLE_ENABLE: "true"
      # 浏览器直传预签名 URL 需要 CORS; 上服务器后建议改成具体域名
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "9000:9000"   # S3 API, 后端与预签名 URL 都用这个
      - "9001:9001"   # 控制台
    volumes:
      - rustfs-data:/data

volumes:
  mysql-data:
  redis-data:
  mongo-data:
  mongo-config:
  es-data:
  rustfs-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:

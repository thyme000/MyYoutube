global:
  resolve_timeout: 1m
route:
  receiver: local-journal
  group_by: [alertname, service, group, component]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 4h
receivers:
  - name: local-journal
    webhook_configs:
      - url: http://local-webhook:8095/alerts
        send_resolved: true
        max_alerts: 100

global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    environment: local
rule_files:
  - /etc/prometheus/rules/pipeline-alerts.yml
  - /etc/prometheus/rules/service-alerts.yml
  - /etc/prometheus/rules/hot-search-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: myyoutube-java
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: [/etc/prometheus/targets/java.yml]
  - job_name: myyoutube-models
    metrics_path: /metrics/
    file_sd_configs:
      - files: [/etc/prometheus/targets/models.yml]
